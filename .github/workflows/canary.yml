name: Write the daily canary

# The canary is the market's only end-to-end check: authored, opened, sealed,
# cleared, resolved and settled inside a single day, so that a break anywhere in
# that chain surfaces within 48 hours instead of at the next long resolution.
#
# It began as a scheduled agent session, which was the wrong call. That put the
# most critical daily component on the least reliable and least observable
# mechanism available: on the first day it fired, produced nothing, and left no
# artefact to inspect, while the mechanical jobs beside it committed three times
# without complaint. A canary needs no judgement - rotate a city, read the
# forecast, set the threshold to the forecast - so it belongs here, in the same
# infrastructure as everything else that has to be dependable.
#
# It runs BEFORE 09:00 UTC because the round it creates opens at 09:00. A canary
# written after its own window has shut can never be traded, and a round that
# fails to clear looks exactly like a day when nobody turned up - which is the
# one thing the canary exists to distinguish. scripts/new-canary.js refuses to
# write in that case rather than publishing an untradeable question.

# Three attempts, not one. GitHub's scheduled runs are best-effort and drift
# badly under load - the clearing job, scheduled at :17 past every sixth hour,
# has been observed firing at 09:52, two and a half hours late. A canary has a
# hard deadline: the round it creates opens at 09:00 and shuts at 15:00, and
# scripts/new-canary.js refuses to write one whose window has already closed,
# because an untradeable question is worse than a missing one.
#
# So a single slot with no margin loses the whole day, which is exactly what
# happened on 27 August. The script exits successfully if today's canary already
# exists - one a day, and a second is not better than one - so later attempts are
# free no-ops and only the first to actually run does anything.
on:
  schedule:
    - cron: '7 4 * * *'
    - cron: '7 6 * * *'
    - cron: '7 8 * * *'
  # Also on any push to main. This is worth less than it looks: a push made with
  # GITHUB_TOKEN does not create a workflow run, and every mechanical commit in
  # this repository is made with GITHUB_TOKEN. So in the day after this trigger
  # was added, four bot commits landed on main and started nothing at all; the
  # only push runs on main were the two commits pushed by hand. The clock I
  # reached for turned out not to tick.
  #
  # It stays because it is free and it does work for pushes by a person or a
  # PAT, and because the script is idempotent: on a push where today's canary
  # already exists it exits successfully having written nothing, so it commits
  # nothing, so it cannot retrigger itself. The mechanism that actually carries
  # the schedule forward is the dispatch at the end of this job.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  # To dispatch seats.yml below. workflow_dispatch is the one event GitHub does
  # deliver when GITHUB_TOKEN raises it, which is what makes that step work
  # where the push trigger above does not.
  actions: write

concurrency:
  group: ledger-write
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write today's canary
        run: node scripts/new-canary.js

      - name: Validate what was written
        run: node scripts/validate.js

      - name: Commit it
        run: |
          if [ -z "$(git status --porcelain questions)" ]; then
            echo "No new canary to commit."
            exit 0
          fi
          git config user.name 'wrong.aecs.io canary'
          git config user.email 'noreply@github.com'
          git add questions
          git commit -m "canary: $(date -u +%Y-%m-%d)" -m "Written by scripts/new-canary.js. Threshold set to the published forecast, so the honest probability is near a half. No model involved."
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            sleep $((2 ** attempt))
            git pull --rebase || true
          done
          echo "Push failed after four attempts." >&2
          exit 1

      - name: Verify history is still append-only
        run: node scripts/verify-integrity.js

      # Hand the baton to the seat job.
      #
      # This is the part that makes the daily cycle self-propagating rather than
      # four independent bets on GitHub's scheduler. The canary has just opened a
      # round that shuts at 15:00, and seats.yml has its own three cron slots
      # inside that window which have been firing at perhaps a third of their
      # schedule. Rather than hope one of them lands, the job that knows a round
      # is open says so.
      #
      # It runs even when no canary was written, because a round left over from
      # an earlier day may still be open and this is the one moment we know a
      # runner is alive. seats.yml commits nothing and dispatches nothing, so the
      # chain is one link long and cannot loop.
      #
      # `|| true` because failing to hand off is not a reason to call a
      # successfully written canary a failure - and a red canary job is the
      # signal that the market's daily heartbeat has stopped, which is far too
      # important to spend on this.
      - name: Ask the seats to trade the round this just opened
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run seats.yml --ref main || true
