name: Clear, resolve and publish

# The mechanical half of the market. It closes rounds whose windows have expired
# and clears them at a uniform price, resolves questions that have come due
# against the sources named when they were written, and republishes the site.
# No model is involved at any point in this workflow -- that is the whole idea.
#
# It runs several times a day because round windows close on their own schedule
# and a book that has closed should be published promptly.

# Also on pushes to main, with the loop guarded by skipping pushes this job
# itself authored - its commits are made as "wrong.aecs.io resolver".
#
# That guard was never needed. A push made with GITHUB_TOKEN does not create a
# workflow run, and every commit here is made with GITHUB_TOKEN, so this job's
# own push could not have retriggered it however it was written. The guard is
# correct and costs nothing, so it stays; but it is worth recording that the
# danger it was built against was imaginary while the benefit the trigger was
# added for - a more dependable clock than GitHub's scheduler - was mostly
# imaginary too. Both were reasoned about carefully and neither was checked
# against what the platform actually does.
on:
  schedule:
    # Every three hours, not every six.
    #
    # GitHub delivers roughly half of the scheduled runs it promises here, and
    # the failure is not academic: the 19:17 slot did not fire on 29 August, so
    # a round that closed at 15:00 was still unclear past 20:00 - the market
    # failing at the one thing it exists for, for five hours, because a cron did
    # not go off. More slots is the same remedy the canary already needed, and
    # it works for the same reason: whichever one fires does the work.
    #
    # This was only affordable once scripts/scoreboard.js stopped rewriting
    # itself on every run. Before that each pass committed a pair of moving
    # timestamps, so doubling the slots would have doubled the noise in a ledger
    # whose readability is most of its value. An idle run now writes nothing.
    - cron: '17 */3 * * *'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      probe:
        description: 'Also probe open predictions for dead sources'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  # To dispatch seats.yml at the end of the run.
  actions: write

concurrency:
  group: ledger-write
  cancel-in-progress: false

jobs:
  resolve:
    # The loop guard. Without it this job's own commit would start it again.
    if: github.event_name != 'push' || github.event.head_commit.author.name != 'wrong.aecs.io resolver'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Orders in this market are sealed to a public key, and clearing them needs
      # the private half on the runner. That step has never once executed: no
      # round has ever contained an order, so scripts/clear-round.js has never
      # had a body to open, so a missing key has never been able to fail.
      #
      # It would have failed on the first round that mattered - correctly, since
      # clearing sealed orders you cannot read means silently dropping them, and
      # the script refuses rather than doing that. But "correctly" is not much
      # comfort when the cost is the market's first cleared round, and the whole
      # reason the seat job is red is a secret that was set in the wrong place.
      # There is no sense discovering the same thing twice.
      #
      # A warning, not a failure: this job also resolves questions and rebuilds
      # the site, and neither needs the key. Turning the whole run red over a
      # step with nothing to do would cost more than it tells anyone.
      - name: Report whether this runner could open a sealed order
        run: |
          if [ -z "${{ secrets.MARKET_SEAL_PRIVATE_KEY }}" ]; then
            echo "::warning title=MARKET_SEAL_PRIVATE_KEY is empty in this workflow::Nothing is broken yet - no round has ever held an order. But config/seal-public-key.pem exists, so every order will be sealed, and the first round with orders in it will refuse to clear on this runner. It must be a GitHub Actions repository secret on elpabl0/Claude-wrong, holding the private half of that key (PEM, or base64 of the PEM)."
          else
            echo "MARKET_SEAL_PRIVATE_KEY resolves here; sealed orders can be opened."
          fi

      # Exit 3 means the script refused to clear a round because it could not
      # open the sealed orders in it. That is a real failure and the job must
      # end red - but not here, because resolving questions and republishing the
      # site need no key and should still happen. So the refusal is remembered
      # and the job fails on it at the very end.
      - name: Clear rounds whose windows have closed
        id: clear
        env:
          MARKET_SEAL_PRIVATE_KEY: ${{ secrets.MARKET_SEAL_PRIVATE_KEY }}
        run: |
          set +e
          node scripts/clear-round.js
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "blocked=1" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Resolve everything due
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: node scripts/resolve.js

      # Sources rot. Probing open predictions weekly means a dead URL surfaces
      # while there is still time to see it coming, rather than as a void on the
      # resolution date.
      - name: Probe open sources
        if: github.event_name == 'schedule' && github.event.inputs.probe != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: node scripts/resolve.js --probe || true

      - name: Recompute the scoreboard the MCP server serves
        run: node scripts/scoreboard.js

      - name: Validate what was written
        run: node scripts/validate.js

      - name: Commit clearings and resolutions
        id: commit
        run: |
          git config user.name 'wrong.aecs.io resolver'
          git config user.email 'noreply@github.com'
          if [ -z "$(git status --porcelain questions rounds resolutions attempts analysis)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to record today."
            exit 0
          fi
          git add questions rounds resolutions attempts analysis
          git commit -m "market: clear and resolve $(date -u +%Y-%m-%dT%H:%MZ)" -m "Written by scripts/clear-round.js and scripts/resolve.js. No model involved."
          for attempt in 1 2 3 4; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((2 ** attempt))
            git pull --rebase || true
          done
          echo "Push failed after four attempts." >&2
          exit 1

      - name: Verify history is still append-only
        run: node scripts/verify-integrity.js

      # This job has just closed every round whose window expired, which means
      # the rounds still open are exactly the ones seats can still trade. It is
      # also, right now, a runner that is demonstrably alive - which is more than
      # can be said for the cron slots seats.yml is otherwise waiting on.
      #
      # seats.yml dispatches nothing in turn, so this cannot loop back here.
      - name: Ask the seats to trade whatever is still open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run seats.yml --ref main || true

      # Last, so that everything which could be done has been done first. A
      # round that closed with orders in it and did not clear is the market
      # failing at the only thing it exists for, and it must not be reported as
      # a healthy run - that is how the first cleared round in this market's
      # history was missed on the day it should have happened.
      - name: Fail if a round could not be cleared
        if: steps.clear.outputs.blocked == '1'
        run: |
          echo "::error title=A closed round could not be cleared::Its orders are sealed and MARKET_SEAL_PRIVATE_KEY is not set on this runner, so they cannot be opened. The round stays queued and will clear correctly once the secret is added as a GitHub Actions repository secret on elpabl0/Claude-wrong. Resolution and publishing in this run were unaffected."
          exit 1

# The site is served by Railway, which redeploys from main on its own. GitHub
# Pages was an alternative publishing path that was never enabled on this
# repository, so this job called it every six hours and failed every six hours -
# turning the run red on a step that publishes nothing anybody reads.
#
# A workflow that is always red is worse than no workflow: it trains everyone to
# ignore the colour, and the next failure that does matter arrives looking
# exactly like this one. pages.yml is kept and can still be dispatched by hand if
# Pages is ever turned on; it is simply no longer on the schedule.
