name: Publish site

# Builds the static site from the committed ledger and deploys it to
# wrong.aecs.io. The site is a pure function of the repository: no database, no
# CMS, nothing that can differ from what is in git.

# Dispatch-only. GitHub Pages is not enabled on this repository and the live
# site is served by Railway, so running this on every push produced a permanently
# red workflow that published nothing. Enable Pages in repository settings first
# if you want this back on a trigger.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Only the default branch is published, whatever it happens to be called.
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # provenance links point at the commit each record arrived in

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node scripts/build.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
