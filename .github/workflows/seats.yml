name: Trade the house seats

# Seat trading was four agent routines on a timer. Over a week they fired many
# times and produced not one order: `rounds/` held nothing but its README while a
# canary round opened and closed with all four firing inside its window. Nothing
# reported an error, because nothing reported anything.
#
# So this moves seat trading to where every reliable commit in this repository
# has come from. It is the same judgement as the canary: do not build the part
# that has to be dependable out of the part that has never been observed to work.
#
# Runs twice inside the round window - once early, once as a second chance if the
# first failed - because rounds close and a missed window cannot be reopened.

on:
  # Spread across the window for the same reason the canary is: scheduled runs
  # drift, and a round that shuts at 15:00 cannot be reopened. Submitting twice
  # is harmless - the per-seat-per-round cap is enforced from the committed
  # record - so extra attempts cost nothing and cover a late or skipped slot.
  # On any push to main as well - GitHub's scheduled runs have been firing at a
  # small fraction of their schedule, and a round that shuts at 15:00 cannot be
  # reopened. The repository's own commit traffic is the more reliable clock.
  # Trading twice is harmless: the per-seat-per-round cap is enforced from the
  # committed record, not from how many times a job happened to run, and this
  # job never commits, so it cannot retrigger itself.
  push:
    branches: [main]
  schedule:
    - cron: '23 10 * * *'
    - cron: '23 12 * * *'
    - cron: '23 14 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Decide and print without submitting'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: house-seats
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Fails with the remediation in the run summary rather than buried in a
      # log tail. A job that fails for a knowable, fixable reason should say what
      # the fix is at the point of failure - otherwise the watchdog raises an
      # issue that only says "this is failing", and someone has to go digging to
      # learn it needed one secret.
      - name: Check configuration
        run: |
          if [ -z "${{ secrets.MARKET_SEAT_SECRET }}" ]; then
            echo "::error title=MARKET_SEAT_SECRET is empty in this workflow::It must be a GITHUB ACTIONS REPOSITORY SECRET on elpabl0/Claude-wrong. A value set anywhere else - Railway, an org secret without this repo in scope, a repository *variable* rather than a secret, or an Environment secret when this job declares no environment - is invisible here. Note the market server's Railway variables are a separate place entirely: the server needs none of this, the runner does. Check: Settings -> Secrets and variables -> Actions -> Repository secrets, spelled exactly MARKET_SEAT_SECRET."
            echo "Diagnostic (no values, only whether each name resolves to something non-empty in THIS workflow):"
            echo "  MARKET_SEAT_SECRET secret : ${{ secrets.MARKET_SEAT_SECRET != '' }}"
            echo "  MARKET_SEAT_SECRET variable: ${{ vars.MARKET_SEAT_SECRET != '' }}   <- true here means it was added as a variable, not a secret"
            echo "  ANTHROPIC_API_KEY secret  : ${{ secrets.ANTHROPIC_API_KEY != '' }}"
            exit 1
          fi
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "::warning title=ANTHROPIC_API_KEY is not set::Trading canary rounds only, at a fixed near-even price. Scored questions are deliberately left alone - a mechanical number presented as a forecast would corrupt the record."
          fi

      - name: Submit orders
        env:
          # One secret, four seats: each credential is derived as
          # HMAC-SHA256(MARKET_SEAT_SECRET, seat_id), so nothing has to be stored
          # per seat and no credential is ever written down anywhere.
          MARKET_SEAT_SECRET: ${{ secrets.MARKET_SEAT_SECRET }}
          # Optional. Without it only canary rounds are traded, at a fixed
          # near-even price, so the daily pipeline test keeps working with no
          # dependency on a paid API. Scored questions are never priced by a
          # fixed rule.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/trade-seats.js ${{ inputs.dry_run && '--dry-run' || '' }}
