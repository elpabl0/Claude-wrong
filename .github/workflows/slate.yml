name: Fetch crowd slate

# Fetches open crowd-forecast questions and their community probabilities from
# Metaculus and Manifold, and commits the result. The authoring instance must
# draw its mirrored questions from this file: validation rejects any mirrored
# prediction whose recorded community probability does not match the slate.
#
# The point is that the forecaster chooses which questions to mirror but never
# gets to choose what the crowd said. Fetching happens here, in a job with no
# model in it, and the result is in git before any prediction is written.

# PAUSED 2026-08-31 at the owner's request.
#
# Every automatic trigger on this workflow has been removed: the cron schedules,
# the push trigger, and (on the watchdog) the workflow_run chain. Only
# workflow_dispatch remains, so nothing fires on its own and the job can still be
# run by hand from the Actions tab.
#
# Nothing else was changed. The scripts, the jobs and the steps are untouched, so
# restarting is a revert of this one commit and the schedules come back exactly
# as they were. The triggers are recorded here so they can be restored by reading
# rather than by archaeology:
#   schedule: '5 7 * * 1'

on:
  workflow_dispatch:
    inputs:
      batch:
        description: 'Batch date (YYYY-MM-DD). Defaults to today.'
        type: string
        required: false
      n:
        description: 'How many candidates to keep'
        type: string
        required: false
        default: '30'

permissions:
  contents: write

concurrency:
  group: ledger-write
  cancel-in-progress: false

jobs:
  slate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch slate
        env:
          # Optional. Without it Metaculus returns 403/429 to datacenter traffic
          # and the slate falls back to Manifold alone.
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: |
          BATCH="${{ inputs.batch }}"
          if [ -z "$BATCH" ]; then BATCH="$(date -u +%Y-%m-%d)"; fi
          node scripts/mirror-candidates.js --batch="$BATCH" --n="${{ inputs.n || '30' }}"

      - name: Commit slate
        run: |
          git config user.name 'wrong.aecs.io slate'
          git config user.email 'noreply@github.com'
          if [ -z "$(git status --porcelain market-slates)" ]; then
            echo "Slate unchanged."
            exit 0
          fi
          git add market-slates
          git commit -m "slate: crowd candidates for $(date -u +%Y-%m-%d)" -m "Fetched by scripts/mirror-candidates.js. Community probabilities recorded as read."
          for attempt in 1 2 3 4; do
            git push && exit 0
            sleep $((2 ** attempt))
            git pull --rebase || true
          done
          exit 1
