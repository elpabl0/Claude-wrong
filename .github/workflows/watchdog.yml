name: Watchdog

# Nothing here watches the market. This watches the WATCHING.
#
# The market's monitoring worked: the liveness check reported "not-started" for
# two days and the daily review fired on schedule and found the problem. Both
# then wrote their findings somewhere only a human reads, and the only route to
# anything being fixed ran through that human noticing and relaying it. An
# unattended system whose escalation path terminates in an inbox is not
# unattended; it has simply moved the manual step somewhere less visible.
#
# So this turns a failure into a GitHub issue - durable, public, attached to the
# repository, and requiring nobody's attention to come into existence. It is
# mechanical on purpose: agent-driven routines in this project have never once
# demonstrably committed anything, while GitHub Actions have committed reliably
# all week, so the escalation path is built out of the half that works.

on:
  workflow_run:
    workflows: ['Clear, resolve and publish', 'Write the daily canary', 'Trade the house seats', 'CI', 'Police the market credential']
    types: [completed]
  schedule:
    - cron: '40 16 * * *' # after the day's rounds have closed and cleared
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  failed-run:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            // One issue per workflow, reopened and appended to rather than a new
            // issue per failure - a hundred identical issues is the same thing as
            // no issues, in the same way a permanently red check is no check.
            const title = `Watchdog: "${run.name}" is failing`;
            const marker = `<!-- watchdog:${run.name} -->`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'all', labels: 'watchdog', per_page: 100,
            });
            const found = existing.data.find((i) => i.body && i.body.includes(marker));
            const body = [
              marker,
              `**${run.name}** failed on \`${run.head_branch}\` at ${run.updated_at}.`,
              '',
              `Run: ${run.html_url}`,
              `Commit: ${run.head_sha}`,
              '',
              'Opened automatically. The market has no route to a human between a job failing and this issue existing, which is the point of it.',
            ].join('\n');

            if (!found) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['watchdog'],
              });
              return;
            }
            if (found.state === 'closed') {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number, state: 'open',
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: found.number,
              body: `Failed again: ${run.html_url} (${run.head_sha.slice(0, 7)}, ${run.updated_at}).`,
            });

  # Give the clearing job a trigger that actually fires.
  #
  # daily.yml has only GitHub's scheduler, and GitHub delivers roughly half of
  # what it promises here. On 29 August the 19:17 slot did not fire and a round
  # that closed at 15:00 was still unclear past 20:00; moving to every three
  # hours helped but did not fix it - the 15:17 slot on the 30th did not fire
  # either. More slots cannot help when the problem is that slots do not run.
  #
  # This workflow, by contrast, is triggered by other workflows COMPLETING, and
  # workflow_run events are delivered reliably regardless of what credential made
  # the commit - which is exactly the property the push trigger turned out to
  # lack. So the watchdog, which already exists to notice that things are stuck,
  # can do something about the one thing it is able to fix.
  #
  # The guard is an allowlist of workflows that nothing else dispatches, which is
  # what makes this acyclic rather than merely unlikely to loop.
  #
  # Excluding daily.yml alone is not enough, and the near-miss is worth writing
  # down. daily.yml dispatches seats.yml; seats.yml completing triggers this
  # workflow; so nudging on seats would give daily -> seats -> watchdog -> daily,
  # a loop with three hops instead of one. It would also have run hottest exactly
  # when clearing is blocked and re-running cannot help - today's case - because
  # nothing in the cycle depends on the clearing succeeding.
  #
  # So the rule is stated the other way round: nudge only on the completion of a
  # job that sits at the head of a chain and that nothing else dispatches. The
  # canary qualifies - it is written by a scheduled job, nothing dispatches it,
  # and it cannot be reached from here, so the graph has no cycle in it by
  # construction and not by a condition that has to keep being true.
  #
  # It is one workflow rather than three because the first version was measured.
  # CI and the credential check were in this list too, and a single push produced
  # five dispatches of the clearing job in nine seconds: that push runs CI, the
  # credential check and the canary, and each completion nudged. Three were
  # cancelled by the concurrency group so nothing was harmed - but it is waste,
  # and a run history full of cancelled jobs reads like something is wrong, which
  # is its own cost.
  #
  # They were never needed either. A push by a person or a PAT already triggers
  # daily.yml through its own push trigger, so nudging on CI was a second route
  # to a job that was already running. The canary is the case that trigger cannot
  # cover, because the canary commit is made with GITHUB_TOKEN and GitHub raises
  # no push event for it. Covering exactly the uncovered case is the whole job.
  #
  # Cheap enough to do unconditionally: since scoreboard.js stopped rewriting
  # itself on every run, a clearing pass with nothing to do writes nothing and
  # commits nothing.
  nudge-clearing:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Write the daily canary'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Ask for a clearing pass
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh workflow run daily.yml --repo "$REPO" --ref main || true

  stalled-market:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Computed from the committed record, not fetched from the site: if the
      # site itself is down, that is precisely when this must still run.
      - name: Compute liveness
        id: live
        run: |
          node -e "
            import('./lib/market.js').then(async (m) => {
              const { liveness } = await import('./lib/liveness.js');
              const market = m.loadMarket({});
              const l = liveness(market);
              const stalled = l.stalled.map((c) => '- ' + c.label + ': ' + c.detail).join('\n');
              console.log('state=' + l.state);
              require('fs').appendFileSync(process.env.GITHUB_OUTPUT,
                'state=' + l.state + '\n' +
                'detail<<EOF\n' + (stalled || 'none') + '\nEOF\n');
            });
          "

      # Repository state and SERVED state are different things and can diverge.
      # Liveness is computed from the committed record, so it reports "running"
      # the moment a question is merged - while the public site can still be
      # serving a build from hours earlier because a deploy queued, failed, or the
      # platform had an outage. Anyone looking at the site sees an empty market
      # and nothing in the repository disagrees with them. So the age of the
      # deployed build is checked as its own signal.
      - name: Check the age of the deployed build
        id: served
        run: |
          set +e
          BODY=$(curl -s --max-time 20 https://wrong.aecs.io/healthz)
          if [ -z "$BODY" ]; then
            echo "age=unreachable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AGE=$(printf '%s' "$BODY" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{process.stdout.write(String(JSON.parse(d).market.built_minutes_ago))}catch(e){process.stdout.write('unknown')}})")
          echo "age=$AGE" >> "$GITHUB_OUTPUT"
          echo "Deployed build is $AGE minutes old."

      - uses: actions/github-script@v7
        with:
          script: |
            const state = ${{ toJSON(steps.live.outputs.state) }};
            const detail = ${{ toJSON(steps.live.outputs.detail) }};
            const servedAge = ${{ toJSON(steps.served.outputs.age) }};

            // The site rebuilds on deploy and the mechanical jobs push several
            // times a day, so a build much older than half a day means deploys
            // have stopped arriving whatever the repository looks like.
            const STALE_MINUTES = 720;
            const ageNum = Number(servedAge);
            const servedStale = servedAge === 'unreachable' || (Number.isFinite(ageNum) && ageNum > STALE_MINUTES);
            const servedMarker = '<!-- watchdog:served -->';
            const all = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'all', labels: 'watchdog', per_page: 100,
            });
            const servedIssue = all.data.find((i) => i.body && i.body.includes(servedMarker));
            if (servedStale) {
              const body = [
                servedMarker,
                servedAge === 'unreachable'
                  ? 'wrong.aecs.io/healthz did not respond.'
                  : `The deployed site is serving a build ${servedAge} minutes old (threshold ${STALE_MINUTES}).`,
                '',
                'The repository can be perfectly healthy while this is true: a queued or failed deploy leaves the public site showing an older market than the one in git, and nothing in the record disagrees with it.',
              ].join('\n');
              if (!servedIssue) {
                await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: 'Watchdog: the deployed site is stale', body, labels: ['watchdog'] });
              } else {
                if (servedIssue.state === 'closed') await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: servedIssue.number, state: 'open' });
                await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: servedIssue.number, body });
              }
            } else if (servedIssue && servedIssue.state === 'open') {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: servedIssue.number, body: `Recovered: deployed build is ${servedAge} minutes old. Closing.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: servedIssue.number, state: 'closed' });
            }
            const marker = '<!-- watchdog:liveness -->';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'all', labels: 'watchdog', per_page: 100,
            });
            const found = existing.data.find((i) => i.body && i.body.includes(marker));

            if (state === 'running') {
              // Close it on recovery, so an open watchdog issue always means
              // something is wrong right now rather than was wrong once.
              if (found && found.state === 'open') {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: found.number, body: 'Recovered: liveness is `running` again. Closing.',
                });
                await github.rest.issues.update({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: found.number, state: 'closed',
                });
              }
              return;
            }

            const body = [
              marker,
              `Market liveness is \`${state}\` as of ${new Date().toISOString()}.`,
              '',
              detail,
              '',
              'Computed from the committed record by `lib/liveness.js`, not from the site, so this fires even when the site is down.',
            ].join('\n');

            if (!found) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Watchdog: market is ${state}`, body, labels: ['watchdog'],
              });
              return;
            }
            if (found.state === 'closed') {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: found.number, state: 'open',
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: found.number, body,
            });
